name: Something isn't working
description: A bug, an error message, or a number that looks wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: dropdown
    id: tab
    attributes:
      label: Where?
      options: [Study Day, Trouble Spots, Keyboard, Settings, About, Decks-screen status bar, Somewhere else]
    validations:
      required: true
  - type: input
    id: anki
    attributes:
      label: Anki version
      description: Help › About in Anki, e.g. 25.02.5
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04…
  - type: textarea
    id: error
    attributes:
      label: Error text
      description: If Anki showed an error window, paste everything in it.
      render: text
